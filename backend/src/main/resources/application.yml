server:
  port: ${PORT:8080}

spring:
  application:
    name: finance-edu
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # pooler do Supabase (plano free) limita conexões por cliente
      maximum-pool-size: ${DB_POOL_SIZE:5}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # HS256 exige ao menos 32 bytes; sem JWT_SECRET (e fora do profile dev) a app não sobe
    secret: ${JWT_SECRET}
    expiracao-horas: 24
  cors:
    origens: ${CORS_ORIGENS:http://localhost:4200}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeedu}
    username: ${DB_USER:financeedu}
    password: ${DB_PASSWORD:financeedu}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
